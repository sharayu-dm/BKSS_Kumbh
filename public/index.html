<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kumbh – Select Assessment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">KUMBH ASSESSMENT</p>
      <h1>Choose your assessment</h1>
      <p>Select a pre-test or post-test, then choose your batch to open its assigned test.</p>
    </header>

    <section aria-labelledby="test-type-title">
      <h2 id="test-type-title">Select test type</h2>
      <div class="test-type-options">
        <button type="button" class="test-type-option" data-test-type="pre">Pre-test</button>
        <button type="button" class="test-type-option" data-test-type="post">Post-test</button>
      </div>
    </section>

    <section id="batch-selection" aria-labelledby="batch-title" hidden>
      <h2 id="batch-title">Select your batch</h2>
      <p id="selected-test-type" class="selection-description"></p>
      <div id="batch-options" class="batch-grid"></div>
      <p id="selection-error" class="error" role="alert" hidden></p>
    </section>

    <p class="admin-link"><a href="/upload">Upload or replace test papers</a></p>
  </main>

  <script src="landing.js"></script>
</body>
</html>
