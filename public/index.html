<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kumbh – MCQ Question Paper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">KUMBH ASSESSMENT</p>
      <h1 id="page-title">MCQ Question Paper</h1>
      <p id="page-description">Select a test to begin.</p>
    </header>

    <section id="test-selection" aria-labelledby="test-selection-title">
      <h2 id="test-selection-title">Choose a test</h2>
      <div id="test-options" class="test-options"></div>
      <p id="selection-error" class="error" hidden></p>

      <section class="upload-section" aria-labelledby="upload-title">
        <h2 id="upload-title">Manage test questions</h2>
        <p>Upload an Excel question paper or download the matching template.</p>
        <div id="upload-options" class="upload-options">
          <div class="upload-option">
            <strong>Test 1</strong>
            <button type="button" class="upload-button" data-upload-test="1">Upload Test 1 Excel</button>
            <a href="/api/tests/1/template">Download template</a>
            <input type="file" accept=".xlsx" data-file-test="1" hidden>
          </div>
          <div class="upload-option">
            <strong>Test 2</strong>
            <button type="button" class="upload-button" data-upload-test="2">Upload Test 2 Excel</button>
            <a href="/api/tests/2/template">Download template</a>
            <input type="file" accept=".xlsx" data-file-test="2" hidden>
          </div>
          <div class="upload-option">
            <strong>Test 3</strong>
            <button type="button" class="upload-button" data-upload-test="3">Upload Test 3 Excel</button>
            <a href="/api/tests/3/template">Download template</a>
            <input type="file" accept=".xlsx" data-file-test="3" hidden>
          </div>
        </div>
        <p id="upload-status" class="upload-status" role="status" aria-live="polite" hidden></p>
      </section>
    </section>

    <section id="quiz" hidden>
      <button type="button" id="back-to-tests" class="back">Back to tests</button>
      <form id="paper" novalidate hidden>
        <section class="card student">
          <label>
            Name of the Student
            <input type="text" id="name" required autocomplete="off">
          </label>
          <label>
            Roll Number
            <input type="text" id="roll" required autocomplete="off">
          </label>
        </section>

        <div id="questions"></div>

        <p id="error" class="error" hidden></p>
        <button type="submit" id="submit">Submit</button>
      </form>
    </section>

    <section id="result" class="card result" hidden>
      <h2>Thank you!</h2>
      <p>Your marks have been submitted.</p>
      <button type="button" id="another-test">Choose another test</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
