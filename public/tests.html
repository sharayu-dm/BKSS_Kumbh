<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kumbh – Assessment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">KUMBH ASSESSMENT</p>
      <h1 id="page-title">Assessment</h1>
      <p id="page-description">Loading the test assigned to your batch...</p>
      <a class="back-link" id="batch-link" href="/">Choose another batch</a>
      <p id="selection-error" class="error" role="alert" hidden></p>
    </header>

    <section id="quiz" hidden>
      <form id="paper" novalidate hidden>
        <section class="card student">
          <label>
            Name of the Student
            <input type="text" id="name" required autocomplete="off">
          </label>
          <label>
            Roll Number
            <input type="text" id="roll" required autocomplete="off">
          </label>
        </section>

        <div id="questions"></div>

        <p id="error" class="error" hidden></p>
        <button type="submit" id="submit">Submit</button>
      </form>
    </section>

    <section id="result" class="card result" hidden>
      <h2>Thank you!</h2>
      <p>Your marks have been submitted.</p>
      <button type="button" id="another-test">Choose another batch</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
